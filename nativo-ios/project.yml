# Proyecto de la app NATIVA (SwiftUI + MapKit).
#
# Se genera con XcodeGen en el runner de macOS (no hace falta subir un .xcodeproj, que es
# lo que rompe las compilaciones). Ver .github/workflows/ios-nativo.yml
name: UbicacionesNativo
options:
  bundleIdPrefix: com.iturri
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

targets:
  UbicacionesNativo:
    type: application
    platform: iOS
    sources:
      - Fuentes
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Ubicaciones
        CFBundleName: Ubicaciones
        CFBundleShortVersionString: "2.0"
        CFBundleVersion: "1"
        # Pantalla de arranque: fondo oscuro del tema (el color está en el catálogo)
        UILaunchScreen:
          UIColorName: FondoArranque
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Permisos: situación en el mapa y avisos de radar con la app en segundo plano
        NSLocationWhenInUseUsageDescription: "Para situarte en el mapa y avisarte de los radares."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Para seguir avisando de los radares con la app en segundo plano."
        UIBackgroundModes:
          - location
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iturri.ubicacionesnativo
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        # El icono de la app sale del catálogo de recursos (lo rellena el workflow)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Sin firma: AltStore/AltServer la firma al instalarla
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
